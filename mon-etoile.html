<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Étoile · Désiré Ménardy</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1c3b4f">
<link rel="stylesheet" href="assets/polices.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="site"></div>
<script src="assets/secours.js"></script>
<script src="assets/site.js"></script>
<script>
chargerContenu().then(d => {
  const P = d.prochain, A = d.auteur, C = d.contact;
  document.title = `${P.titre} · ${A.nom}`;
  document.getElementById('site').innerHTML = nav(d, false) + `
  <main>
    ${enTete({lab: `Le prochain roman de ${esc(A.nom)}`, titre: `<em>${esc(P.titre)}</em>`, sous: P.annee ? `Sortie prévue en ${esc(P.annee)}` : ''})}
    <section class="rubrique ciel"><div class="astres" aria-hidden="true"></div><span class="filante" aria-hidden="true"></span><div class="w">
      <div class="etoile-page">
        ${P.image ? `<img src="${img(P.image)}" data-loupe alt="${esc(P.titre)}">` : '<span></span>'}
        <div>
          <div class="lab">Le livre</div>
          <h2>En cours d'écriture</h2>
          <div class="txt">${paras(P.resume || P.texte)}</div>
        </div>
      </div>
    </div></section>
  </main>` + pied(d);
  finaliser();
  if (window.PRERENDU) return;
  // Ciel étoilé : les étoiles s'allument une à une quand on arrive sur la section
  const ciel = document.querySelector('.ciel'), astres = ciel.querySelector('.astres');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('span'); s.className = 'astre';
    s.style.cssText = `left:${Math.random() * 100}%;top:${Math.pow(Math.random(), 1.4) * 100}%;--t:${(Math.random() * 2 + 1).toFixed(1)}px;--o:${(Math.random() * .6 + .35).toFixed(2)};--d:${(Math.random() * 4 + 3).toFixed(1)}s;--r:${(i * .06 + Math.random()).toFixed(2)}s`;
    astres.appendChild(s);
  }
  new IntersectionObserver((es, o) => es.forEach(e => { if (e.isIntersecting) { ciel.classList.add('allume'); o.disconnect(); } }), {threshold: .15}).observe(ciel);
});
</script>
</body>
</html>
